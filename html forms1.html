<html>
<head>
<title>HTML Form - All Form Controls</title>
</head>
<body>
<center>
<h1>HTML Form - All Form Controls</h1>
</center>
<form>
<fieldset>
<legend><b>Personal Information</b></legend>
<table width="100%" cellpadding="8">
<tr>
<td>
<label>Text Input:</label><br>
<input type="text" placeholder="Enter your name" >
</td>
<td>
<label>Password Input:</label><br>
<input type="password" placeholder="Password">
</td>
</tr>
<tr>
<td>
<label>Email Input:</label><br>
<input type="email" placeholder="Enter your email">
</td>
<td>
<label>Number Input:</label><br>
<input type="number" placeholder="Enter your age">
</td>
</tr>
<tr>
<td>
<label>Tel Input:</label><br>
<input type="tel" placeholder="Enter phone number">
</td>
<td>
<label>URL Input:</label><br>
<input type="url" placeholder="Enter website link">
</td>
</tr>
<tr>
<td>
<label>Search Input:</label><br>
<input type="search" placeholder="Search here...">
</td>
<td>
<label>Date Input:</label><br>
<input type="date">
</td>
</tr>
<tr>
<td>
<label>Time Input:</label><br>
<input type="time">
</td>
<td>
<label>Date & Time Local Input:</label><br>
<input type="datetime-local">
</td>
</tr>
<tr>
<td>
<label>Month Input:</label><br>
<input type="month">
</td>
<td>
<label>Week Input:</label><br>
<input type="week">
</td>
</tr>
<tr>
<td>
<label>Color Input:</label><br>
<input type="color">
</td>
<td>
<label>Range Input:</label><br>
<input type="range">
</td>
</tr>
<tr>
<td>
<label>File Input:</label><br>
<input type="file">
</td>
<td></td>
</tr>
</table>
</fieldset>
<br>
<fieldset>
<legend><b>Selection Controls</b></legend>
<table width="100%" cellpadding="8">
<tr>
<td align="top">
<label>Dropdown (Select):</label><br>
<select>
<option>-- Choose a Department --</option>
<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
<option>Mechanical</option>
<option>Civil</option>
</select>
</td>
<td align="top">
<label>Radio Buttons:</label><br>
<input type="radio" name="gender">Male<br>
<input type="radio" name="gender">Female<br>
<input type="radio" name="gender">Other
</td>
<td align="top">
<label>Checkboxes:</label><br>
<input type="checkbox">HTML<br>
<input type="checkbox">CSS<br>
<input type="checkbox">JavaScript<br>
<input type="checkbox">Python
</td>
</tr>
<tr>
<td>
<label>Textarea:</label><br>
<textarea rows="6" cols="35" placeholder="Enter your address"></textarea>
</td>
<td colspan="2">
<label>Multiple Select:</label><br>
<select multiple>
<option>Apple</option>
<option>Banana</option>
<option>Orange</option>
<option>Mango</option>
</select>
</td>
</tr>
</table>
</fieldset>
<br>
<fieldset>
<legend><b>Form Buttons</b></legend>
<center>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
<input type="button" value="Button">
</center>
</fieldset>
</form>
</body>
</html>
